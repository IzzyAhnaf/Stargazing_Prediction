# ==============================================================================
# Cloudflare Tunnel Configuration: cloudflare/config.yml
# Use this when running cloudflared via named tunnel configuration file
# ==============================================================================

tunnel: <YOUR-TUNNEL-UUID>
credentials-file: /etc/cloudflared/<YOUR-TUNNEL-UUID>.json

# Ingress Rules: Routes public incoming traffic directly to local Docker containers
ingress:
  # 1. Route API requests to FastAPI ML Backend container
  - hostname: api-stargazing.yourdomain.com
    service: http://backend:8000
    originRequest:
      connectTimeout: 30s
      noTLSVerify: true

  # 2. Route Web App requests to Next.js Frontend container
  - hostname: stargazing.yourdomain.com
    service: http://frontend:3000
    originRequest:
      connectTimeout: 30s
      noTLSVerify: true

  # 3. Fallback catch-all 404 rule (Required by Cloudflare Tunnel)
  - service: http_status:404
